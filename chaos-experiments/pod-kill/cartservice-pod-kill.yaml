# Documentation: https://chaos-mesh.org/docs/simulate-pod-chaos-on-kubernetes/
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: cartservice-pod-kill
  namespace: chaos-mesh
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - otel-demo
    labelSelectors:
      'app.kubernetes.io/component': cartservice