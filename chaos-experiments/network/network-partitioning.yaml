# Documentation: https://chaos-mesh.org/docs/simulate-network-chaos-on-kubernetes/

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: checkout-payment-partition
  namespace: chaos-mesh
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - otel-demo
    labelSelectors:
      app.kubernetes.io/name: checkout
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - otel-demo
      labelSelectors:
        app.kubernetes.io/name: payment
  duration: "2m"