apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-experiments
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yasmineelhakem/resilience-platform.git
    targetRevision: main
    path: chaos-experiments
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true