# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

configMapGenerator:
  - name: grafana-dashboard-baseline-health
    files:
      - Service_Health.json
    options:
      labels:
        grafana_dashboard: "1"

  - name: grafana-dashboard-chaos-experiments
    files:
      - Chaos_Experiments.json
    options:
      labels:
        grafana_dashboard: "1"

  - name: grafana-dashboard-scoreboard
    files:
      - Scoreboard.json
    options:
      labels:
        grafana_dashboard: "1"
        
generatorOptions:
  disableNameSuffixHash: true